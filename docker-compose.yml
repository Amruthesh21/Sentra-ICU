networks:
  docker_compose_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_COMPOSE_SUBNET:-172.31.0.0/16}

services:
  alarm-engine:
    build: ./CIS-Deployment/alarmEngine
    container_name: CIS-alarm-engine
    ports:
      - "7020:9020"
    environment:
      SPRING_RABBITMQ_HOST: host.docker.internal
      SPRING_RABBITMQ_PORT: 7003
      SPRING_RABBITMQ_VIRTUAL_HOST: ICUcharting
      SPRING_RABBITMQ_USERNAME: ICUcharting
      SPRING_RABBITMQ_PASSWORD: admin@123
      SPRING_DATA_MONGODB_URI: mongodb://monish:admin%40123@host.docker.internal:7000/?authSource=admin
      ALARM_DEVICE_DATA_QUEUE: alarm-engine.device.data.queue
      ALARM_DEMO_VITALS_ENABLED: "false"
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_ALARM_ENGINE:-172.31.0.10}

  notification-service:
    build: ./CIS-Deployment/notificationService
    container_name: CIS-notification-service
    ports:
      - "7030:9030"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RABBITMQ_URL: amqp://ICUcharting:admin%40123@host.docker.internal:7003/ICUcharting
      MONGODB_URI: mongodb://monish:admin%40123@host.docker.internal:7000/?authSource=admin
      VAPID_PUBLIC_KEY: BLKYwR9R10uXjN-4niWs483ccOlJFLSC0SahNIN7NZy_BTRuQ07UiT_ENTUV-mtjHGSWhutwD6bMu2jRBC-VFA4
      VAPID_PRIVATE_KEY: 567k1VQcCBf9V-xSND_osaQdf0MKKQy6mfSIChFMLEg
      VAPID_EMAIL: mailto:poc@Sentra ICU.health
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_NOTIFICATION_SERVICE:-172.31.0.11}

  icu-watch-pwa:
    build: ./CIS-Deployment/icuWatchPwa
    container_name: CIS-icu-watch-pwa
    ports:
      - "7031:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_ICU_WATCH_PWA:-172.31.0.12}

  rabbitmq-setup:
    image: curlimages/curl:latest
    container_name: CIS-rabbitmq-setup
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "
        echo 'Waiting 25 seconds for RabbitMQ and Connect Engine to be ready...' &&
        sleep 25 &&
        echo 'Creating destination queue...' &&
        curl -s -f -u ICUcharting:admin@123
          -X PUT 'http://host.docker.internal:7004/api/queues/ICUcharting/alarm-engine.device.data.queue'
          -H 'Content-Type: application/json'
          -d '{\"durable\":true,\"auto_delete\":false,\"arguments\":{}}' &&
        echo 'Creating shovel...' &&
        curl -s -f -u ICUcharting:admin@123
          -X PUT 'http://host.docker.internal:7004/api/parameters/shovel/ICUcharting/device-to-alarm-engine'
          -H 'Content-Type: application/json'
          -d '{\"value\":{\"src-protocol\":\"amqp091\",\"src-uri\":\"amqp://ICUcharting:admin%40123@host.docker.internal:7003/ICUcharting\",\"src-queue\":\"device.data.queue\",\"dest-protocol\":\"amqp091\",\"dest-uri\":\"amqp://ICUcharting:admin%40123@host.docker.internal:7003/ICUcharting\",\"dest-queue\":\"alarm-engine.device.data.queue\",\"ack-mode\":\"on-publish\",\"src-prefetch-count\":1000,\"reconnect-delay\":5}}' &&
        echo 'RabbitMQ shovel setup complete.' ||
        echo 'Shovel plugin may not be enabled. Trying exchange binding fallback...' &&
        curl -s -u ICUcharting:admin@123
          -X POST 'http://host.docker.internal:7004/api/bindings/ICUcharting/e/amq.fanout/q/alarm-engine.device.data.queue'
          -H 'Content-Type: application/json'
          -d '{\"routing_key\":\"\"}' &&
        echo 'Fallback binding done.'
      "
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_RABBITMQ_SETUP:-172.31.0.13}

  ngrok:
    image: ngrok/ngrok:latest
    container_name: CIS-ngrok
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: http host.docker.internal:7031 --log stdout
    ports:
      - "4040:4040"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_NGROK:-172.31.0.14}
    restart: unless-stopped
