# MongoDB + RabbitMQ for ICU CIS stack and Alarm POC
# Ports: MongoDB 7000, RabbitMQ AMQP 7003, RabbitMQ Management 7004

services:
  mongodb:
    image: mongo:7
    container_name: CIS-mongodb
    ports:
      - "7000:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${INFRA_MONGO_USER:-monish}
      # NOTE: this same value is also embedded directly (URL-encoded) in the
      # mongodb:// URIs in docker-compose.yml/docker-compose.poc.yml. If you
      # change it from the default, either pick a value with no reserved URI
      # characters (@ : / ? # [ ]), or update those URI lines to match.
      MONGO_INITDB_ROOT_PASSWORD: ${INFRA_MONGO_PASSWORD:-admin@123}
    volumes:
      - cis_mongodb_data:/data/db
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_MONGODB:-172.31.0.20}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: CIS-rabbitmq
    ports:
      - "7003:5672"
      - "7004:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${INFRA_RABBITMQ_USER:-ICUcharting}
      # Same note as MONGO_INITDB_ROOT_PASSWORD above — embedded (URL-encoded)
      # in amqp:// URIs elsewhere; avoid reserved URI characters if you change it.
      RABBITMQ_DEFAULT_PASS: ${INFRA_RABBITMQ_PASSWORD:-admin@123}
      RABBITMQ_DEFAULT_VHOST: ICUcharting
    command: >
      bash -c "rabbitmq-plugins enable rabbitmq_shovel rabbitmq_shovel_management && rabbitmq-server"
    volumes:
      - cis_rabbitmq_data:/var/lib/rabbitmq
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_RABBITMQ:-172.31.0.21}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: CIS-postgres
    ports:
      - "7001:5432"
    environment:
      POSTGRES_DB: icu_hub
      POSTGRES_USER: icu_hub
      POSTGRES_PASSWORD: ${INFRA_POSTGRES_PASSWORD:-hub@123}
    volumes:
      - cis_postgres_data:/var/lib/postgresql/data
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_POSTGRES:-172.31.0.22}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icu_hub -d icu_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  docker_compose_network:
    name: alarampoc_docker_compose_network
    external: true

volumes:
  cis_mongodb_data:
  cis_rabbitmq_data:
  cis_postgres_data:
