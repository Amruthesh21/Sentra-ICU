server.port=9020

spring.application.name=alarm-engine

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://monish:admin%40123@localhost:7000/?authSource=admin}
spring.data.mongodb.database=v2-ICU-Connect

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:7001/icu_hub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:icu_hub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hub@123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

hub.ocr.tessdata-path=${TESSDATA_PREFIX:/usr/share/tesseract-ocr/5/tessdata}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:7003}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:ICUcharting}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:ICUcharting}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin@123}

alarm.rabbitmq.device-data-queue=${ALARM_DEVICE_DATA_QUEUE:alarm-engine.device.data.queue}
alarm.rabbitmq.notify-queue=alarm.notify.queue
alarm.config.cache-ttl-seconds=30

# Vitals trend archive (Mongo hubTrendVitals) — default 5 min between snapshots per bed
vitals.archive.interval-ms=${VITALS_ARCHIVE_INTERVAL_MS:300000}

# ——— CORS ———
# Comma-separated list of origins allowed to call /api/** directly from a
# browser. The Hub and PWA proxy the API through their own nginx (same
# origin, no CORS involved), so this only matters for local dev servers and
# any external client hitting alarm-engine's port directly.
hub.cors.allowed-origins=${HUB_CORS_ALLOWED_ORIGINS:http://localhost:7040,http://localhost:5174}

# ——— Auth / MFA (Sentra ICU) ———
hub.auth.jwt.secret=${HUB_AUTH_JWT_SECRET:icu-connect-v2-change-this-secret-in-production-sentra-2026}
hub.auth.jwt.access-minutes=${HUB_AUTH_ACCESS_MINUTES:60}
hub.auth.jwt.refresh-days=${HUB_AUTH_REFRESH_DAYS:14}
hub.auth.enforced=${HUB_AUTH_ENFORCED:true}
hub.auth.dev-expose-otp=${HUB_AUTH_DEV_EXPOSE_OTP:false}
hub.auth.otp.expiry-minutes=${HUB_AUTH_OTP_EXPIRY_MINUTES:5}
hub.auth.otp.reset-expiry-minutes=${HUB_AUTH_RESET_EXPIRY_MINUTES:15}
hub.auth.mfa.issuer=${HUB_AUTH_MFA_ISSUER:Sentra ICU}
hub.auth.mfa.trust-minutes=${HUB_AUTH_MFA_TRUST_MINUTES:60}
hub.auth.super-admin.email=${SUPER_ADMIN_EMAIL:admin@example.com}
hub.auth.super-admin.username=${SUPER_ADMIN_USERNAME:superadmin}
hub.auth.super-admin.display-name=${SUPER_ADMIN_DISPLAY_NAME:Super Admin}
hub.auth.super-admin.password=${SUPER_ADMIN_PASSWORD:}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_SSL_TRUST:${SMTP_HOST:}}
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
hub.auth.mail.from=${AUTH_MAIL_FROM:${hub.auth.super-admin.email}}
hub.auth.mail.enabled=${SMTP_ENABLED:false}

# Hospital device gateway (device-ingestion). The Hub never talks to that
# service by hostname — alarm-engine proxies /api/device-ingestion/** to
# the per-hospital URL (hub_hospitals.device_ingestion_url) or this default.
# Local all-in-one: http://CIS-device-ingestion:9050. Split cloud: leave empty
# and set each hospital's gateway URL in Super Admin.
device.ingestion.url=${DEVICE_INGESTION_URL:http://CIS-device-ingestion:9050}
device.ingestion.require-https=${DEVICE_INGESTION_REQUIRE_HTTPS:false}
device.ingestion.connect-timeout-ms=${DEVICE_INGESTION_CONNECT_TIMEOUT_MS:3000}
device.ingestion.read-timeout-ms=${DEVICE_INGESTION_READ_TIMEOUT_MS:15000}
