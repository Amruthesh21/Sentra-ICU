# Simulator on cis-deployment network ONLY (172.25.0.8) so CE matches bed IP in Mongo.
# RabbitMQ via host port 7003 (CIS-rabbitmq published on host).
#
#   sudo docker compose -f docker-compose.yml -f docker-compose.simulator.yml up -d --force-recreate icuconnectdevicesimulatorbed1

services:
  icuconnectdevicesimulatorbed1:
    build: ./CIS-Deployment/deviceSimulation
    container_name: CIS-Deployment-device-simulation-bed1
    depends_on:
      - connectengine
    environment:
      NICU_DIR: /deviceSimulation
      DEVICES: BplUltimaPrimeDevice,BplElisa600Device,AgiliaDevice
      SPRING_RABBITMQ_HOST: host.docker.internal
      SPRING_RABBITMQ_PORT: "7003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      cis-deployment_docker_compose_network:
        ipv4_address: 172.25.0.8
    restart: unless-stopped

networks:
  cis-deployment_docker_compose_network:
    external: true
