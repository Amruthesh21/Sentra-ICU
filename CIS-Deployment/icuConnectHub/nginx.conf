server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://CIS-alarm-engine:9020/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    # Connect-a-device + live waveforms. Proxied through alarm-engine so the
    # Hub container does not need device-ingestion on the same docker network
    # (hospital gateway lives on the hospital LAN; cloud reaches it over VPN).
    location /device-ingestion/ {
        proxy_pass http://CIS-alarm-engine:9020/api/device-ingestion/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
}
