services:

  mongodb:
    image: mongo:6.0
    container_name: mongodb-live
    network_mode: host
    environment:
      MONGO_INITDB_ROOT_USERNAME: monish
      MONGO_INITDB_ROOT_PASSWORD: admin@123
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    command: mongod --port 7000
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-live
    network_mode: host
    environment:
      RABBITMQ_DEFAULT_USER: ICUcharting
      RABBITMQ_DEFAULT_PASS: admin@123
      RABBITMQ_DEFAULT_VHOST: ICUcharting
      RABBITMQ_NODE_PORT: 7003
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
        -rabbitmq_management listener [{port,7004}]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: critixperticu-nginx-live
    network_mode: host
    depends_on:
      - critixperticubackendengine
    volumes:
      - ./CIS-Deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./CIS-Deployment/nginx/cisFrontend:/nginx/cisFrontend
    restart: unless-stopped

  connectengine:
    build: ./CIS-Deployment/connectEngine
    container_name: CIS-Deployment-connect-engine-live
    ports:
      - "9010:9010"
    volumes:
      - ./CIS-Deployment/connectEngine/config:/CIS-Deployment/config
      - ./CIS-Deployment/connectEngine/logs:/CIS-Deployment/connectEngine/logs
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: "file:/connectEngine/config/"
      DRIVERS_PATH: /connectEngine/driverJarsDump/
      SPRING_DATA_MONGODB_URI: "mongodb://monish:admin%40123@CIS-mongodb:27017/v2-ICU-Connect?authSource=admin&authMechanism=SCRAM-SHA-256"
      SPRING_RABBITMQ_HOST: CIS-rabbitmq
      SPRING_RABBITMQ_VIRTUAL_HOST: ICUcharting
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ICUcharting
      SPRING_RABBITMQ_PASSWORD: admin@123
    networks:
      alarampoc_docker_compose_network: {}
      cis-deployment_docker_compose_network:
        ipv4_address: 172.25.0.3
        aliases:
          - connectengine
    restart: unless-stopped

  visualizationengine:
    build: ./CIS-Deployment/visualizationEngine
    container_name: CIS-Deployment-visualization-engine-live
    network_mode: host
    volumes:
      - ./CIS-Deployment/visualizationEngine/config:/CIS-Deployment/config
      - ./CIS-Deployment/visualizationEngine/logs:/CIS-Deployment/visualizationEngine/logs
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: "file:/visualizationEngine/config/"
      SPRING_DATA_MONGODB_URI: "mongodb://monish:admin%40123@localhost:7000/v2-ICU-Connect?authSource=admin&authMechanism=SCRAM-SHA-256"
      SPRING_RABBITMQ_HOST: localhost
      SPRING_RABBITMQ_VIRTUAL_HOST: ICUcharting
      SPRING_RABBITMQ_PORT: 7003
      SPRING_RABBITMQ_USERNAME: ICUcharting
      SPRING_RABBITMQ_PASSWORD: admin@123
    restart: unless-stopped

  critixperticubackendengine:
    build: ./CIS-Deployment/cisBackend
    container_name: CIS-Deployment-cisBackend-engine-live
    network_mode: host
    volumes:
      - ./CIS-Deployment/cisBackend/config:/cisBackend/config
      - ./CIS-Deployment/cisBackend/logs:/cisBackend/logs
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/cisBackend/config/
      SPRING_DATA_MONGODB_URI: "mongodb://monish:admin%40123@localhost:7000/ICU-Charting?authSource=admin&authMechanism=SCRAM-SHA-256"
      SPRING_RABBITMQ_HOST: localhost
      SPRING_RABBITMQ_VIRTUAL_HOST: ICUcharting
      SPRING_RABBITMQ_PORT: 7003
      SPRING_RABBITMQ_USERNAME: ICUcharting
      SPRING_RABBITMQ_PASSWORD: admin@123
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  alarampoc_docker_compose_network:
    external: true
  cis-deployment_docker_compose_network:
    external: true
