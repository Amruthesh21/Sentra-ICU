# Standalone POC compose — no connectengine dependency
# Use when Docker works but connectengine is in a separate compose file:
#   docker compose -f docker-compose.poc.yml up --build -d
#
# Postgres/Mongo/RabbitMQ are NOT defined here — they live in
# docker-compose.infra.yml (repo root), brought up separately first; see
# CIS-Deployment/deviceIngestion/docs/RUNBOOK.md. This file used to declare
# its own duplicate `postgres` service (byte-identical to infra.yml's, same
# container_name CIS-postgres) — harmless as long as you only ever started
# one of the two, but a guaranteed container-name collision on a genuine
# full cold start of both files together, which is exactly what the RUNBOOK
# documents doing. Removed rather than kept in sync by hand.
#
# Cold-start race, and why every service below carries restart: unless-stopped:
# because infra lives in a separate compose file/project, nothing here can
# depends_on: it, so app containers can start before Postgres/Mongo/RabbitMQ
# are actually ready to accept connections. notification-service (Node)
# connects to its dependencies eagerly at startup with no retry and exit(1)
# on failure — restart: unless-stopped turns that into an automatic retry.
# device-ingestion now retries RabbitMQ with backoff (hospital VPN flaps),
# but still carries the same restart policy. The Hub no longer names
# device-ingestion in nginx (Connect-a-device is proxied through alarm-engine),
# so Hub can start without a gateway on this network.

networks:
  docker_compose_network:
    name: alarampoc_docker_compose_network
    external: true

services:
  alarm-engine:
    build: ./CIS-Deployment/alarmEngine
    container_name: CIS-alarm-engine
    ports:
      - "7020:9020"
    env_file:
      - .env
    environment:
      SPRING_RABBITMQ_HOST: CIS-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_VIRTUAL_HOST: ICUcharting
      SPRING_RABBITMQ_USERNAME: ${INFRA_RABBITMQ_USER:-ICUcharting}
      SPRING_RABBITMQ_PASSWORD: ${INFRA_RABBITMQ_PASSWORD:-admin@123}
      # URL-encoded copy of INFRA_MONGO_PASSWORD above (the connection string
      # needs %-encoding; Compose can't do that substitution for you) — if you
      # change INFRA_MONGO_PASSWORD, update this URI to match.
      SPRING_DATA_MONGODB_URI: mongodb://${INFRA_MONGO_USER:-monish}:${INFRA_MONGO_PASSWORD_URLENC:-admin%40123}@CIS-mongodb:27017/?authSource=admin
      ALARM_DEVICE_DATA_QUEUE: alarm-engine.device.data.queue
      SPRING_DATASOURCE_URL: jdbc:postgresql://CIS-postgres:5432/icu_hub
      SPRING_DATASOURCE_USERNAME: icu_hub
      SPRING_DATASOURCE_PASSWORD: ${INFRA_POSTGRES_PASSWORD:-hub@123}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@example.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      HUB_AUTH_DEV_EXPOSE_OTP: ${HUB_AUTH_DEV_EXPOSE_OTP:-false}
      HUB_AUTH_ENFORCED: ${HUB_AUTH_ENFORCED:-true}
      HUB_CORS_ALLOWED_ORIGINS: ${HUB_CORS_ALLOWED_ORIGINS:-http://localhost:7040,http://localhost:5174}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-}
      # Local all-in-one: Hub → alarm-engine → this hostname. Split cloud
      # deployments leave this empty and set each hospital's gateway URL in
      # Super Admin instead. See CIS-Deployment/docs/HOSPITAL-GATEWAY.md.
      DEVICE_INGESTION_URL: ${DEVICE_INGESTION_URL:-http://CIS-device-ingestion:9050}
      DEVICE_INGESTION_REQUIRE_HTTPS: ${DEVICE_INGESTION_REQUIRE_HTTPS:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Cold-start race + restart: unless-stopped — see the top-of-file note.
    restart: unless-stopped
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_ALARM_ENGINE:-172.31.0.10}

  notification-service:
    build: ./CIS-Deployment/notificationService
    container_name: CIS-notification-service
    # Not published to the host — it has no authentication of its own
    # (subscription list/create/delete are all open), so it stays reachable
    # only inside the docker network, via the PWA's nginx proxy at
    # /api/notification/*.
    # Cold-start race + restart: unless-stopped — see the top-of-file note.
    # (src/index.js connects to Mongo/RabbitMQ eagerly at startup with no retry.)
    restart: unless-stopped
    expose:
      - "9030"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RABBITMQ_URL: amqp://${INFRA_RABBITMQ_USER:-ICUcharting}:${INFRA_RABBITMQ_PASSWORD_URLENC:-admin%40123}@CIS-rabbitmq:5672/ICUcharting
      MONGODB_URI: mongodb://${INFRA_MONGO_USER:-monish}:${INFRA_MONGO_PASSWORD_URLENC:-admin%40123}@CIS-mongodb:27017/?authSource=admin
      # Generate with: npx web-push generate-vapid-keys — put them in .env
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:admin@example.com}
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_NOTIFICATION_SERVICE:-172.31.0.11}

  icu-watch-pwa:
    build: ./CIS-Deployment/icuWatchPwa
    container_name: CIS-icu-watch-pwa
    ports:
      - "7031:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_ICU_WATCH_PWA:-172.31.0.12}

  icu-connect-hub:
    build: ./CIS-Deployment/icuConnectHub
    container_name: CIS-icu-connect-hub
    ports:
      - "${HUB_UI_PORT:-8000}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_ICU_CONNECT_HUB:-172.31.0.15}

  # SentraICU's own bedside device gateway — replaces Connect Engine for the
  # raw device-vitals ingestion path only. Publishes directly to the same
  # RabbitMQ queue alarm-engine already consumes (alarm-engine.device.data.queue),
  # bypassing device.data.queue / the shovel entirely. See
  # CIS-Deployment/deviceIngestion/docs/MIGRATION-NOTE.md.
  device-ingestion:
    build: ./CIS-Deployment/deviceIngestion
    container_name: CIS-device-ingestion
    ports:
      # HTTP admin API (9050) is not published to the host in the laptop
      # all-in-one: Hub reaches it through alarm-engine's /api/device-ingestion
      # proxy. HL7/JSON TCP ports stay published for bedside devices / simulation.
      - "${DEVICE_INGESTION_HL7_PORT:-7061}:6661"
      - "${DEVICE_INGESTION_JSON_PORT:-7062}:6662"
    # Cold-start race + restart: unless-stopped — see the top-of-file note.
    restart: unless-stopped
    expose:
      - "9050"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RABBITMQ_URL: amqp://${INFRA_RABBITMQ_USER:-ICUcharting}:${INFRA_RABBITMQ_PASSWORD_URLENC:-admin%40123}@CIS-rabbitmq:5672/ICUcharting
      DEVICE_DATA_QUEUE: alarm-engine.device.data.queue
      # Must match alarm-engine's hub.auth.jwt.secret (HUB_AUTH_JWT_SECRET)
      # exactly — this is what lets device-ingestion verify Hub login
      # tokens itself instead of trusting the docker network.
      HUB_AUTH_JWT_SECRET: ${HUB_AUTH_JWT_SECRET:-icu-connect-v2-change-this-secret-in-production-sentra-2026}
    volumes:
      - ./CIS-Deployment/deviceIngestion/config:/app/config
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_DEVICE_INGESTION:-172.31.0.16}

  rabbitmq-setup:
    image: curlimages/curl:latest
    container_name: CIS-rabbitmq-setup
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RABBITMQ_SETUP_USER: ${INFRA_RABBITMQ_USER:-ICUcharting}
      RABBITMQ_SETUP_PASS: ${INFRA_RABBITMQ_PASSWORD:-admin@123}
      RABBITMQ_SETUP_PASS_URLENC: ${INFRA_RABBITMQ_PASSWORD_URLENC:-admin%40123}
    volumes:
      - ./CIS-Deployment/scripts/rabbitmq-setup.sh:/rabbitmq-setup.sh:ro
    entrypoint: ["/bin/sh", "/rabbitmq-setup.sh"]
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_RABBITMQ_SETUP:-172.31.0.13}

  ngrok:
    image: ngrok/ngrok:latest
    container_name: CIS-ngrok
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: http host.docker.internal:7031 --log stdout
    ports:
      - "4040:4040"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - icu-watch-pwa
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_NGROK:-172.31.0.14}
    restart: unless-stopped
