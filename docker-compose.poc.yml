# Standalone POC compose — no connectengine dependency
# Use when Docker works but connectengine is in a separate compose file:
#   docker compose -f docker-compose.poc.yml up --build -d

networks:
  docker_compose_network:
    name: alarampoc_docker_compose_network
    external: true

services:
  postgres:
    image: postgres:16-alpine
    container_name: CIS-postgres
    ports:
      - "7001:5432"
    environment:
      POSTGRES_DB: icu_hub
      POSTGRES_USER: icu_hub
      POSTGRES_PASSWORD: hub@123
    volumes:
      - cis_postgres_data:/var/lib/postgresql/data
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_POSTGRES:-172.31.0.22}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icu_hub -d icu_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  alarm-engine:
    build: ./CIS-Deployment/alarmEngine
    container_name: CIS-alarm-engine
    ports:
      - "7020:9020"
    env_file:
      - .env
    environment:
      SPRING_RABBITMQ_HOST: CIS-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_VIRTUAL_HOST: ICUcharting
      SPRING_RABBITMQ_USERNAME: ICUcharting
      SPRING_RABBITMQ_PASSWORD: admin@123
      SPRING_DATA_MONGODB_URI: mongodb://monish:admin%40123@CIS-mongodb:27017/?authSource=admin
      ALARM_DEVICE_DATA_QUEUE: alarm-engine.device.data.queue
      CONNECT_ENGINE_URL: ${CONNECT_ENGINE_URL:-http://CIS-Deployment-connect-engine:9010}
      CONNECT_ENGINE_AUTO_RESTART: "true"
      CONNECT_ENGINE_RESTART_DEBOUNCE_MS: "15000"
      CONNECT_ENGINE_POST_SAVE_DEBOUNCE_MS: "10000"
      CONNECT_ENGINE_RESTART_ON_PATIENT_CHANGE: "false"
      CONNECT_ENGINE_CONTAINER: CIS-Deployment-connect-engine
      SPRING_DATASOURCE_URL: jdbc:postgresql://CIS-postgres:5432/icu_hub
      SPRING_DATASOURCE_USERNAME: icu_hub
      SPRING_DATASOURCE_PASSWORD: hub@123
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-monish.reddy@invensis.net}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      HUB_AUTH_DEV_EXPOSE_OTP: ${HUB_AUTH_DEV_EXPOSE_OTP:-false}
      HUB_AUTH_ENFORCED: ${HUB_AUTH_ENFORCED:-true}
      HUB_CORS_ALLOWED_ORIGINS: ${HUB_CORS_ALLOWED_ORIGINS:-http://localhost:7040,http://localhost:5174}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_ALARM_ENGINE:-172.31.0.10}

  notification-service:
    build: ./CIS-Deployment/notificationService
    container_name: CIS-notification-service
    # Not published to the host — it has no authentication of its own
    # (subscription list/create/delete are all open), so it stays reachable
    # only inside the docker network, via the PWA's nginx proxy at
    # /api/notification/*. See SECURITY-REPORT.md.
    expose:
      - "9030"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RABBITMQ_URL: amqp://ICUcharting:admin%40123@CIS-rabbitmq:5672/ICUcharting
      MONGODB_URI: mongodb://monish:admin%40123@CIS-mongodb:27017/?authSource=admin
      VAPID_PUBLIC_KEY: BLKYwR9R10uXjN-4niWs483ccOlJFLSC0SahNIN7NZy_BTRuQ07UiT_ENTUV-mtjHGSWhutwD6bMu2jRBC-VFA4
      VAPID_PRIVATE_KEY: 567k1VQcCBf9V-xSND_osaQdf0MKKQy6mfSIChFMLEg
      VAPID_EMAIL: mailto:poc@Sentra ICU.health
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_NOTIFICATION_SERVICE:-172.31.0.11}

  icu-watch-pwa:
    build: ./CIS-Deployment/icuWatchPwa
    container_name: CIS-icu-watch-pwa
    ports:
      - "7031:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_ICU_WATCH_PWA:-172.31.0.12}

  icu-connect-hub:
    build: ./CIS-Deployment/icuConnectHub
    container_name: CIS-icu-connect-hub
    ports:
      - "${HUB_UI_PORT:-8000}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_ICU_CONNECT_HUB:-172.31.0.15}

  # SentraICU's own bedside device gateway — replaces Connect Engine for the
  # raw device-vitals ingestion path only. Publishes directly to the same
  # RabbitMQ queue alarm-engine already consumes (alarm-engine.device.data.queue),
  # bypassing device.data.queue / the shovel entirely. See
  # CIS-Deployment/deviceIngestion/docs/MIGRATION-NOTE.md.
  device-ingestion:
    build: ./CIS-Deployment/deviceIngestion
    container_name: CIS-device-ingestion
    ports:
      # HTTP admin API (9050) is intentionally NOT published to the host —
      # it has no authentication of its own (see SECURITY-REPORT.md), so it
      # must stay reachable only inside the docker network, via the Hub's
      # nginx proxy at /device-ingestion/*. The HL7 TCP port stays published
      # since real bedside monitors connect to it directly over the network.
      - "${DEVICE_INGESTION_HL7_PORT:-7061}:6661"
    expose:
      - "9050"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RABBITMQ_URL: amqp://ICUcharting:admin%40123@CIS-rabbitmq:5672/ICUcharting
      DEVICE_DATA_QUEUE: alarm-engine.device.data.queue
    volumes:
      - ./CIS-Deployment/deviceIngestion/config:/app/config
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_DEVICE_INGESTION:-172.31.0.16}

  rabbitmq-setup:
    image: curlimages/curl:latest
    container_name: CIS-rabbitmq-setup
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "
        echo 'Waiting 25 seconds for RabbitMQ to be ready...' &&
        sleep 25 &&
        echo 'Creating destination queue...' &&
        curl -s -f -u ICUcharting:admin@123
          -X PUT 'http://host.docker.internal:7004/api/queues/ICUcharting/alarm-engine.device.data.queue'
          -H 'Content-Type: application/json'
          -d '{\"durable\":true,\"auto_delete\":false,\"arguments\":{}}' &&
        echo 'Creating shovel...' &&
        curl -s -f -u ICUcharting:admin@123
          -X PUT 'http://host.docker.internal:7004/api/parameters/shovel/ICUcharting/device-to-alarm-engine'
          -H 'Content-Type: application/json'
          -d '{\"value\":{\"src-protocol\":\"amqp091\",\"src-uri\":\"amqp://ICUcharting:admin%40123@host.docker.internal:7003/ICUcharting\",\"src-queue\":\"device.data.queue\",\"dest-protocol\":\"amqp091\",\"dest-uri\":\"amqp://ICUcharting:admin%40123@host.docker.internal:7003/ICUcharting\",\"dest-queue\":\"alarm-engine.device.data.queue\",\"ack-mode\":\"on-publish\",\"src-prefetch-count\":1000,\"reconnect-delay\":5}}' &&
        echo 'RabbitMQ shovel setup complete.'
      "
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_RABBITMQ_SETUP:-172.31.0.13}

  ngrok:
    image: ngrok/ngrok:latest
    container_name: CIS-ngrok
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: http host.docker.internal:7031 --log stdout
    ports:
      - "4040:4040"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - icu-watch-pwa
    networks:
      docker_compose_network:
        ipv4_address: ${DOCKER_COMPOSE_IP_NGROK:-172.31.0.14}
    restart: unless-stopped

volumes:
  cis_postgres_data:
